name: Journal RSS Cloud Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    paths:
      - 'journal-watch/rss_parser.py'
      - 'journal-watch/history.py'
      - 'tests/**'
      - '.github/workflows/journal-rss-cloud.yml'

permissions:
  contents: write

concurrency:
  group: journal-rss-cloud
  cancel-in-progress: false

jobs:
  fetch-journal-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout public metadata repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test cumulative archive invariants
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and parse RSS 2.0, RDF/RSS 1.0, and Atom
        run: python3 journal-watch/rss_parser.py
      - name: Publish JSON snapshot to default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal-watch/public/latest.json journal-watch/public/latest_compact.json journal-watch/public/history.json journal-watch/public/discoveries.json
          if ! git diff --cached --quiet; then
            git commit -m "Update journal RSS snapshot"
            git push
          else
            echo "Snapshot unchanged"
          fi
